[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "strategic-systems-engine"
version = "0.1.0"
description = "A research-oriented, domain-independent game theory and strategic simulation engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SSE Contributors" }]
dependencies = []

[project.optional-dependencies]
science = ["numpy>=1.26", "scipy>=1.11"]
dev = ["pytest>=8.0", "hypothesis>=6.100", "ruff>=0.5", "mypy>=1.10"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
all = ["numpy>=1.26", "scipy>=1.11", "pytest>=8.0", "hypothesis>=6.100", "ruff>=0.5", "mypy>=1.10", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
sse = "sse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001", "TRY004", "SIM102"]



[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
